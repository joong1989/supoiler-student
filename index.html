<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수포일러 | 학생</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>

:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#14213d;background:#f4f6fb;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;line-height:1.65}button,input,select{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 70px}
.card{background:#fff;border:1px solid #e5eaf4;border-radius:22px;padding:clamp(18px,4vw,36px);box-shadow:0 14px 40px #14213d0b}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand-mark{display:grid;place-items:center;background:#2546c7;color:white;border-radius:13px;width:48px;height:48px;font-size:25px;font-weight:800}.brand h1{font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0;letter-spacing:-.04em}.brand p{font-size:13px;margin:5px 0 0;color:#66758f}
h2{font-size:21px;margin:18px 0}h3{font-size:19px;margin:30px 0 12px}h4{margin:0 0 10px}p{margin:10px 0;color:#40506a}
label{display:block;font-weight:650;margin:16px 0 0}input:not([type=radio]),select{width:100%;min-height:50px;margin-top:7px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:#14213d}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #92adff;outline-offset:2px}
button{width:100%;min-height:48px;border:0;border-radius:12px;background:#2546c7;color:#fff;padding:12px 16px;margin-top:16px;font-weight:700;cursor:pointer;transition:background .15s}
button:hover{background:#1e39a3}button:disabled{opacity:.55;cursor:wait}.hidden{display:none!important}.muted,.info{font-size:13px;color:#66758f}.err{color:#b42318}.ok{color:#14794d}#msg{min-height:22px;font-size:14px}
#account>h2{padding:12px 16px;background:#f0f4ff;border-radius:12px;font-size:17px;margin:0}#logout{width:auto;min-height:40px;padding:8px 16px;margin-top:12px;background:#eef2ff;color:#2546c7;font-size:14px}#logout:hover{background:#e1e9ff}
.quizcard{padding:18px;border:1px solid #dbe3f0;border-radius:16px;margin:12px 0;background:#fff}.quizcard strong{font-size:16px}.quizcard p{margin:7px 0}.quizcard button{margin-top:10px}
.stat{background:#eef2ff;color:#1e3b80;padding:14px;border-radius:12px;margin:12px 0;font-weight:650}
.chart{margin:14px 0;padding:16px;border:1px solid #dbe3f0;border-radius:15px}.chart h4{font-size:15px}.chartrow{display:grid;grid-template-columns:60px minmax(0,1fr) 70px;gap:10px;align-items:center;margin:12px 0;font-size:13px;font-variant-numeric:tabular-nums}.chartrow>span:last-child{text-align:right}.charttrack{background:#e8eefb;border-radius:10px;height:16px;overflow:hidden}.chartfill{height:100%;background:#2546c7;border-radius:10px}.chartfill.rate{background:#15967d}
.quiz{padding:16px 0;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}.smallbtn{margin:10px 0 0;font-size:14px;min-height:44px}.detailbox{margin:14px 0 8px}.detailbox h4{font-size:16px}
.review{padding:16px;border:1px solid #dbe3f0;border-left:5px solid #15967d;border-radius:12px;margin:12px 0;background:#fff}.review.bad{border-left-color:#d92d20;background:#fffafa}.review.good{border-left-color:#15967d;background:#f9fffc}.review p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}.review strong{display:block}
#quizPlay{margin:18px 0;padding:18px;border:1px solid #dbe3f0;border-radius:16px;background:#fbfcff}#quizPlay h3{margin:0 0 12px}#quizPlay>p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:16px}
#quizPlay label.option{display:flex;align-items:flex-start;gap:10px;padding:13px 12px;border:1px solid #dbe3f0;border-radius:12px;margin:9px 0;background:white;cursor:pointer;font-weight:500;line-height:1.65;min-height:48px}
#quizPlay label.option:has(input:checked){background:#edf3ff;border-color:#2546c7;box-shadow:inset 0 0 0 1px #2546c7}
#quizPlay label.option input{flex:none;width:19px;height:19px;margin:3px 0 0;accent-color:#2546c7}#quizPlay label.option span{min-width:0;overflow-wrap:anywhere}
.question{padding:16px 0;border-bottom:1px solid #e2e8f0}.question strong{white-space:pre-wrap}.option{display:block;padding:7px 0}sup{font-size:.72em;line-height:0;vertical-align:super}.math-content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}.math-content .katex{font-size:1.04em}.math-content .katex-html{white-space:nowrap}.math-content .math-fallback{font-family:inherit}
@media(max-width:520px){.wrap{padding:0 0 35px}.card{border:0;border-radius:0;min-height:100vh;padding:22px 18px}.chart{padding:12px}.chartrow{grid-template-columns:48px minmax(0,1fr) 62px;gap:7px}.review{padding:13px}#quizPlay{padding:14px}}
@media(prefers-reduced-motion:reduce){button{transition:none}*{scroll-behavior:auto!important}}

</style>
</head>
<body>
<main class="wrap"><section class="card">
<header class="brand"><div class="brand-mark" aria-hidden="true">∑</div><div><h1>수포일러</h1><p>수학 포기하기엔 아직 일러 · 학생용</p></div></header>
<div id="login"><label for="cls">학년반</label><select id="cls"><option value="">불러오는 중...</option></select><label for="name">이름</label><input id="name" maxlength="30" autocomplete="name" placeholder="이름"><label for="pin">4자리 PIN</label><input id="pin" maxlength="4" inputmode="numeric" type="password" autocomplete="off" placeholder="숫자 4자리"><p class="muted">처음 이용하는 학생은 입력한 정보로 계정이 자동 생성될 수 있습니다. 이름과 PIN을 다른 사람에게 알려주지 마세요.</p><button id="loginBtn">로그인 / 처음 가입</button></div>
<div id="account" class="hidden"><h2 id="who"></h2><button id="logout">로그아웃</button><h3>공개 퀴즈</h3><div id="quizList">불러오는 중...</div><div id="quizDetail" class="hidden"></div><div id="quizPlay" class="hidden"></div><h3>내 학습기록</h3><div id="records">불러오는 중...</div></div>
<p id="msg" role="status" aria-live="polite"></p></section></main>
<script>
// 7.3단계: KaTeX로 명시적 수식과 안전하게 인식되는 짧은 수식만 조판합니다.
// 한글 문장은 텍스트로 유지하고, 인식하지 못하는 부분은 원문 그대로 표시합니다.
const MATH_SUP={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'-'};
function normalizeMath(s){
  return s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]+/g,t=>'^{' + [...t].map(c=>MATH_SUP[c]).join('') + '}')
    .replace(/\\leq?\b|≤|<=/g,'\\leq ')
    .replace(/\\geq?\b|≥|>=/g,'\\geq ')
    .replace(/\\neq\b|≠|!=/g,'\\ne ')
    .replace(/∈/g,'\\in ').replace(/∉/g,'\\notin ')
    .replace(/∩/g,'\\cap ').replace(/∪/g,'\\cup ')
    .replace(/⊆/g,'\\subseteq ').replace(/⊂/g,'\\subset ')
    .replace(/⊇/g,'\\supseteq ').replace(/⊃/g,'\\supset ')
    .replace(/∅/g,'\\varnothing ').replace(/×/g,'\\times ')
    .replace(/÷/g,'\\div ')
    .replace(/\^([0-9a-zA-Z])/g,'^{$1}');
}
function mathText(element,raw){
  const source=String(raw??'');element.replaceChildren();element.classList.add('math-content');
  const appendPlain=t=>{if(t)element.append(document.createTextNode(t));};
  const appendMath=t=>{
    if(!t)return;
    if(!window.katex){appendPlain(t);return;}
    try{
      const span=document.createElement('span');
      window.katex.render(normalizeMath(t),span,{throwOnError:true,strict:'ignore',trust:false,output:'htmlAndMathml'});
      element.append(span);
    }catch(e){appendPlain(t);}
  };
  // $...$와 \\(...\\)는 작성자가 명시한 수식으로 취급합니다.
  // 일반 문장에서는 변수+지수, 부등식, 집합 연산, 절댓값 등 확실한 패턴만 인식합니다.
  const explicit=/\$([^$\n]{1,300})\$|\\\(([^\n]{1,300}?)\\\)/g;
  function scanPlain(text){
    // 정규식은 한글 조사(는, 에, 이다 등)를 수식으로 끌어들이지 않도록 제한합니다.
    const expr=/(?:\|[A-Za-z][A-Za-z0-9^{}+\-* ]{0,18}\|\s*(?:<=|>=|[<>≤≥=])\s*-?\d+)|(?:[A-Za-z](?:\^\{?-?[A-Za-z0-9]+\}?|[⁰¹²³⁴⁵⁶⁷⁸⁹]+)?\s*(?:<=|>=|[<>≤≥=≠]|\\(?:leq|geq|neq)\b)\s*-?\d+(?:\^\{?\d+\}?)?)|(?:[A-Za-z]\s*(?:∈|∉|\\(?:in|notin)\b)\s*[A-Za-z])|(?:[A-Za-z]\s*(?:∪|∩|⊂|⊆|⊃|⊇|\\(?:cup|cap|subseteq|subset|supseteq|supset)\b)\s*[A-Za-z])|(?:[A-Za-z]\^\{?-?[A-Za-z0-9]+\}?)|(?:[A-Za-z][⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g;
    let last=0,m;
    while((m=expr.exec(text))){
      // 영단어 중간에서 변수를 잡지 않도록 좌측 경계 확인.
      if(m.index>0 && /[A-Za-z0-9_]/.test(text[m.index-1]))continue;
      appendPlain(text.slice(last,m.index));appendMath(m[0]);last=expr.lastIndex;
    }
    appendPlain(text.slice(last));
  }
  let last=0,m;
  while((m=explicit.exec(source))){scanPlain(source.slice(last,m.index));appendMath(m[1]??m[2]);last=explicit.lastIndex;}
  scanPlain(source.slice(last));
}

let activeAttempt=null,questionTimer=null;
const API='https://supoiler-student-api.joong1989.workers.dev';const $=id=>document.getElementById(id);let token=sessionStorage.getItem('supoiler_session5')||'';
function msg(s,err=false){$('msg').textContent=s;$('msg').className=err?'err':'ok'}
function showLogin(){token='';sessionStorage.removeItem('supoiler_session5');$('account').classList.add('hidden');$('login').classList.remove('hidden');$('pin').value='';}
async function classes(){try{const r=await(await fetch(API+'/api/classes')).json();if(!r.ok)throw Error();$('cls').replaceChildren(new Option('학년반 선택',''),...r.classes.map(x=>new Option(x,x)));}catch{$('cls').replaceChildren(new Option('학년반을 불러오지 못했습니다',''));msg('서버 연결을 확인해 주세요.',true)}}
function makeChart(box,quizzes,title,kind){
 const chart=document.createElement('section');chart.className='chart';const h=document.createElement('h4');h.textContent=title;chart.append(h);
 const ordered=[...quizzes].reverse().slice(-10);const max=kind==='score'?Math.max(1000,...ordered.map(q=>Number(q.score)||0)):100;
 ordered.forEach((q,i)=>{const value=kind==='score'?(Number(q.score)||0):(q.total?Math.round(q.correct/q.total*100):0);const row=document.createElement('div');row.className='chartrow';const name=document.createElement('span');name.textContent=(i+1)+'회차';name.title=q.title+' · '+q.date;const track=document.createElement('div');track.className='charttrack';const fill=document.createElement('div');fill.className='chartfill'+(kind==='rate'?' rate':'');fill.style.width=Math.max(0,Math.min(100,value/max*100))+'%';track.append(fill);const val=document.createElement('span');val.textContent=value+(kind==='rate'?'%':'점');row.append(name,track,val);chart.append(row)});box.append(chart);
}
async function showReview(resultId,container){
 container.replaceChildren();const loading=document.createElement('p');loading.textContent='오답 정보를 불러오는 중...';container.append(loading);
 try{const res=await fetch(API+'/api/my-record/'+encodeURIComponent(resultId),{headers:{Authorization:'Bearer '+token}});const r=await res.json();if(!r.ok)throw Error(r.error||'조회 실패');container.replaceChildren();
 const title=document.createElement('h4');title.textContent=r.result.title+' · '+r.result.correct+'/'+r.result.total+'문항 정답';container.append(title);
 if(!r.items.length){const p=document.createElement('p');p.textContent='이전 응시의 문항별 답안 정보가 없습니다.';container.append(p)}
 r.items.forEach(item=>{const card=document.createElement('div');card.className='review '+(item.correct?'good':'bad');const h=document.createElement('strong');h.textContent=item.number+'번 · '+(item.correct?'정답':'오답')+(item.timedOut?' (시간 초과)':'');const q=document.createElement('p');mathText(q,item.question);const a=document.createElement('p');mathText(a,'내 답: '+item.myAnswer);card.append(h,q,a);if(!item.correct){const c=document.createElement('p');mathText(c,'정답: '+item.correctAnswer);card.append(c)}container.append(card)});
 }catch(e){container.textContent='오답 확인 실패: '+e.message}
}
async function records(){try{const res=await fetch(API+'/api/my-record',{headers:{Authorization:'Bearer '+token}}),r=await res.json();if(!r.ok){if(res.status===401)showLogin();throw Error(r.error||'기록 조회 실패')};$('who').textContent=r.student.className+' '+r.student.name;const box=$('records');box.replaceChildren();const s=document.createElement('div');s.className='stat';s.textContent=`참여 ${r.summary.count}회 · 평균 ${r.summary.avgScore}점 · 정답률 ${r.summary.correctRate}%`;box.append(s);
 if(r.quizzes.length){makeChart(box,r.quizzes,'점수 변화 (최근 10회)','score');makeChart(box,r.quizzes,'정답률 변화 (최근 10회)','rate')}
 for(const q of r.quizzes){const d=document.createElement('div');d.className='quiz';const text=document.createElement('div');text.textContent=`${q.date} · ${q.title} · ${q.score}점 (${q.correct}/${q.total} 정답, 오답 ${q.wrong}개)`;const b=document.createElement('button');b.className='smallbtn';b.textContent='문항별 결과 확인';const detail=document.createElement('div');detail.className='detailbox hidden';b.onclick=async()=>{if(!detail.classList.contains('hidden')){detail.classList.add('hidden');b.textContent='문항별 결과 확인';return;}detail.classList.remove('hidden');b.textContent='결과 접기';await showReview(q.resultId,detail)};d.append(text,b,detail);box.append(d)}if(!r.quizzes.length){const p=document.createElement('p');p.textContent='아직 참여한 퀴즈가 없습니다.';box.append(p)}}catch(e){msg(e.message,true)}}
$('loginBtn').onclick=async()=>{const className=$('cls').value,name=$('name').value.trim(),pin=$('pin').value;if(!className||!name||!/^[0-9]{4}$/.test(pin))return msg('학년반, 이름, 숫자 4자리 PIN을 입력해 주세요.',true);$('loginBtn').disabled=true;msg('확인 중...');try{const res=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({className,name,pin})}),r=await res.json();if(!r.ok)throw Error(r.error||'로그인 실패');token=r.session;sessionStorage.setItem('supoiler_session5',token);$('login').classList.add('hidden');$('account').classList.remove('hidden');msg(r.created?'계정이 생성되었습니다.':'로그인되었습니다.');await Promise.all([records(),loadQuizzes()])}catch(e){msg(e.message,true)}finally{$('loginBtn').disabled=false}};
$('logout').onclick=()=>{if(activeAttempt){msg('진행 중인 퀴즈를 마친 뒤 로그아웃해 주세요.',true);return;}showLogin();msg('로그아웃되었습니다.')};classes();if(token){$('login').classList.add('hidden');$('account').classList.remove('hidden');Promise.all([records(),loadQuizzes()])}

async function loadQuizzes(){
 const box=$('quizList');box.textContent='공개 퀴즈를 불러오는 중...';
 try{const res=await fetch(API+'/api/quizzes',{headers:{Authorization:'Bearer '+token}});const r=await res.json();if(!r.ok)throw Error(r.error||'퀴즈 조회 실패');box.replaceChildren();
 if(!r.quizzes.length){box.textContent='현재 공개된 퀴즈가 없습니다.';return;}
 for(const q of r.quizzes){const d=document.createElement('div');d.className='quizcard';const h=document.createElement('strong');h.textContent=q.title;const p=document.createElement('p');p.className='info';p.textContent=[q.unit,q.questionCount+'문항',q.startMode,q.gameMode].filter(Boolean).join(' · ');const b=document.createElement('button');b.textContent='퀴즈 시작';b.onclick=()=>startQuiz(q.quizId);d.append(h,p,b);box.append(d);}
 }catch(e){box.textContent='퀴즈 목록을 불러오지 못했습니다.';msg(e.message,true)}
}
async function previewQuiz(quizId){
 const box=$('quizDetail');box.classList.remove('hidden');box.textContent='문항을 불러오는 중...';
 try{const res=await fetch(API+'/api/quizzes/'+encodeURIComponent(quizId),{headers:{Authorization:'Bearer '+token}});const r=await res.json();if(!r.ok)throw Error(r.error||'문항 조회 실패');box.replaceChildren();const h=document.createElement('h3');h.textContent=r.quiz.title;box.append(h);const p=document.createElement('p');p.className='info';p.textContent='6A단계: 문항 확인만 가능합니다. 답안 제출과 점수 저장은 다음 단계에서 연결합니다.';box.append(p);
 for(const q of r.questions){const d=document.createElement('div');d.className='question';const t=document.createElement('strong');mathText(t,q.number+'. '+q.question);d.append(t);if(q.type==='객관식'){q.options.forEach((x,i)=>{const o=document.createElement('div');o.className='option';mathText(o,(i+1)+'. '+x);d.append(o)});}else{const o=document.createElement('p');o.className='info';o.textContent='단답형 · 정답은 표시하지 않습니다.';d.append(o)}const tm=document.createElement('p');tm.className='info';tm.textContent=q.timeLimit?'제한시간 '+q.timeLimit+'초':'제한시간 없음';d.append(tm);box.append(d)}
 }catch(e){box.textContent='문항을 불러오지 못했습니다.';msg(e.message,true)}
}


async function startQuiz(quizId){
 if(activeAttempt)return msg('진행 중인 퀴즈를 먼저 마쳐 주세요.',true);
 const box=$('quizPlay');box.classList.remove('hidden');box.textContent='퀴즈를 준비하는 중...';$('quizDetail').classList.add('hidden');
 try{const res=await fetch(API+'/api/quiz-start',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({quizId})});const r=await res.json();if(!r.ok)throw Error(r.error||'퀴즈 시작 실패');if(!r.questions.length)throw Error('문항이 없습니다.');
 activeAttempt={ticket:r.ticket,quiz:r.quiz,questions:r.questions,index:0,answers:[]};renderQuestion();box.scrollIntoView({behavior:'smooth',block:'start'});
 }catch(e){box.textContent='퀴즈를 시작하지 못했습니다.';msg(e.message,true)}
}
function renderQuestion(){
 clearInterval(questionTimer);const a=activeAttempt;if(!a)return;const q=a.questions[a.index],box=$('quizPlay');box.replaceChildren();
 const heading=document.createElement('h3');heading.textContent=`${a.quiz.title} (${a.index+1}/${a.questions.length})`;box.append(heading);
 const title=document.createElement('p');title.style.whiteSpace='pre-wrap';mathText(title,q.number+'. '+q.question);box.append(title);
 const timer=document.createElement('p');timer.className='stat';box.append(timer);
 const form=document.createElement('div');let answerInput;
 if(q.type==='객관식'){
  const group='choice'+a.index;q.options.forEach((opt,i)=>{const label=document.createElement('label');label.className='option';const radio=document.createElement('input');radio.type='radio';radio.name=group;radio.value=String(i+1);radio.style.width='auto';radio.style.marginRight='10px';label.append(radio);const optionText=document.createElement('span');mathText(optionText,(i+1)+'. '+opt);label.append(optionText);form.append(label)});
  answerInput=()=>form.querySelector('input:checked')?.value||'';
 }else{const inp=document.createElement('input');inp.placeholder='답 입력';inp.maxLength=300;form.append(inp);answerInput=()=>inp.value.trim();}
 box.append(form);const btn=document.createElement('button');btn.textContent=a.index===a.questions.length-1?'마지막 답안 제출':'다음 문항';box.append(btn);
 const start=performance.now(),limit=Math.max(0,Number(q.timeLimit)||0);let done=false;
 const complete=async(timeout=false)=>{if(done)return;done=true;clearInterval(questionTimer);btn.disabled=true;const elapsed=(performance.now()-start)/1000;
 const responseTimeSec=Math.round((limit>0?Math.min(elapsed,limit):elapsed)*1000)/1000;
 a.answers.push({questionId:q.questionId,answer:timeout?'':answerInput(),responseTimeSec,timedOut:timeout});a.index++;
 if(a.index<a.questions.length)renderQuestion();else await submitAttempt();};
 btn.onclick=()=>complete(false);
 const tick=()=>{const elapsed=(performance.now()-start)/1000;if(limit>0){const remain=Math.max(0,limit-elapsed);timer.textContent='남은 시간: '+remain.toFixed(1)+'초';if(remain<=0)complete(true);}else timer.textContent='제한시간 없음';};
 tick();questionTimer=setInterval(tick,100);
}
async function submitAttempt(){
 const a=activeAttempt,box=$('quizPlay');box.textContent='채점 및 저장 중...';
 try{const res=await fetch(API+'/api/quiz-submit',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({ticket:a.ticket,answers:a.answers})});const r=await res.json();if(!r.ok)throw Error(r.error||'제출 실패');activeAttempt=null;box.replaceChildren();const title=document.createElement('h3');title.textContent='응시 완료';const p=document.createElement('p');p.textContent=`${r.score}점 · ${r.correct}/${r.total}문항 정답`;box.append(title,p);msg('퀴즈 결과가 저장되었습니다.');await records();}
 catch(e){box.replaceChildren();const p=document.createElement('p');p.className='err';p.textContent='저장에 실패했습니다: '+e.message;const retry=document.createElement('button');retry.textContent='동일한 답안 다시 제출';retry.onclick=submitAttempt;box.append(p,retry);msg('결과가 저장되지 않았을 수 있습니다. 새 퀴즈를 시작하지 말고 재제출해 주세요.',true)}
}

</script>

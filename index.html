<style>

:root{font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;color:#14213d;background:#f4f6fb;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;line-height:1.65}button,input,select{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 70px}
.card{background:#fff;border:1px solid #e5eaf4;border-radius:22px;padding:clamp(18px,4vw,36px);box-shadow:0 14px 40px #14213d0b}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand-mark{display:grid;place-items:center;background:#2546c7;color:white;border-radius:13px;width:48px;height:48px;font-size:25px;font-weight:800}.brand h1{font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0;letter-spacing:-.04em}.brand p{font-size:13px;margin:5px 0 0;color:#66758f}
h2{font-size:21px;margin:18px 0}h3{font-size:19px;margin:30px 0 12px}h4{margin:0 0 10px}p{margin:10px 0;color:#40506a}
label{display:block;font-weight:650;margin:16px 0 0}input:not([type=radio]),select{width:100%;min-height:50px;margin-top:7px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;color:#14213d}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #92adff;outline-offset:2px}
button{width:100%;min-height:48px;border:0;border-radius:12px;background:#2546c7;color:#fff;padding:12px 16px;margin-top:16px;font-weight:700;cursor:pointer;transition:background .15s}
button:hover{background:#1e39a3}button:disabled{opacity:.55;cursor:wait}.hidden{display:none!important}.muted,.info{font-size:13px;color:#66758f}.err{color:#b42318}.ok{color:#14794d}#msg{min-height:22px;font-size:14px}
#account>h2{padding:12px 16px;background:#f0f4ff;border-radius:12px;font-size:17px;margin:0}#logout{width:auto;min-height:40px;padding:8px 16px;margin-top:12px;background:#eef2ff;color:#2546c7;font-size:14px}#logout:hover{background:#e1e9ff}
.quizcard{padding:18px;border:1px solid #dbe3f0;border-radius:16px;margin:12px 0;background:#fff}.quizcard strong{font-size:16px}.quizcard p{margin:7px 0}.quizcard button{margin-top:10px}
.stat{background:#eef2ff;color:#1e3b80;padding:14px;border-radius:12px;margin:12px 0;font-weight:650}
.chart{margin:14px 0;padding:16px;border:1px solid #dbe3f0;border-radius:15px}.chart h4{font-size:15px}.chartrow{display:grid;grid-template-columns:60px minmax(0,1fr) 70px;gap:10px;align-items:center;margin:12px 0;font-size:13px;font-variant-numeric:tabular-nums}.chartrow>span:last-child{text-align:right}.charttrack{background:#e8eefb;border-radius:10px;height:16px;overflow:hidden}.chartfill{height:100%;background:#2546c7;border-radius:10px}.chartfill.rate{background:#15967d}
.quiz{padding:16px 0;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}.smallbtn{margin:10px 0 0;font-size:14px;min-height:44px}.detailbox{margin:14px 0 8px}.detailbox h4{font-size:16px}
.review{padding:16px;border:1px solid #dbe3f0;border-left:5px solid #15967d;border-radius:12px;margin:12px 0;background:#fff}.review.bad{border-left-color:#d92d20;background:#fffafa}.review.good{border-left-color:#15967d;background:#f9fffc}.review p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}.review strong{display:block}
#quizPlay{margin:18px 0;padding:18px;border:1px solid #dbe3f0;border-radius:16px;background:#fbfcff}#quizPlay h3{margin:0 0 12px}#quizPlay>p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:16px}
#quizPlay label.option{display:flex;align-items:flex-start;gap:10px;padding:13px 12px;border:1px solid #dbe3f0;border-radius:12px;margin:9px 0;background:white;cursor:pointer;font-weight:500;line-height:1.65;min-height:48px}
#quizPlay label.option:has(input:checked){background:#edf3ff;border-color:#2546c7;box-shadow:inset 0 0 0 1px #2546c7}
#quizPlay label.option input{flex:none;width:19px;height:19px;margin:3px 0 0;accent-color:#2546c7}#quizPlay label.option span{min-width:0;overflow-wrap:anywhere}
.question{padding:16px 0;border-bottom:1px solid #e2e8f0}.question strong{white-space:pre-wrap}.option{display:block;padding:11px 0;line-height:2.5}sup{font-size:.72em;line-height:0;vertical-align:super}.math-content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:2.5;padding-top:5px;padding-bottom:5px;overflow:visible}.math-content .katex{font-size:1.04em;display:inline-block;vertical-align:middle;line-height:1.3}.math-content .katex-html{white-space:nowrap}.math-content .math-fallback{font-family:inherit}
@media(max-width:520px){.wrap{padding:0 0 35px}.card{border:0;border-radius:0;min-height:100vh;padding:22px 18px}.chart{padding:12px}.chartrow{grid-template-columns:48px minmax(0,1fr) 62px;gap:7px}.review{padding:13px}#quizPlay{padding:14px}}

.portalnav{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.portalnav button{width:auto;min-height:39px;margin:0;padding:8px 12px;font-size:13px;background:#eaf0ff;color:#2546c7}.portalnav button[aria-current="page"]{background:#2546c7;color:white}.portal-item{padding:16px;border:1px solid #dbe3f0;border-radius:14px;margin:12px 0}.portal-item h4{margin:0 0 6px}.portal-item p{white-space:pre-wrap;overflow-wrap:anywhere}.portal-form textarea{width:100%;min-height:110px;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font:inherit}.portal-form label{margin:12px 0 5px}.portal-form select,.portal-form input{margin-top:4px}.portal-link{overflow-wrap:anywhere}

/* 8.3: 포털 본문 타이포그래피 및 안전한 서식 표현 */
.portal-item{background:#fff;border-color:#e2e8f2;padding:20px 22px;box-shadow:0 2px 10px rgba(22,44,88,.025)}
.portal-item h4{font-size:16px;letter-spacing:-.025em;font-weight:750;color:#172b51}
.portal-item small{display:block;margin:8px 0 12px;color:#71809b;font-size:12px}

.portal-rich p{margin:0 0 .6em;white-space:normal;line-height:inherit}
.portal-rich p:last-child{margin-bottom:0}

.portal-rich ul,.portal-rich ol{padding-left:1.5em;margin:.5em 0}

.portal-rich img{max-width:100%;height:auto;border-radius:8px}
.portal-rich table{max-width:100%;border-collapse:collapse;display:block;overflow-x:auto}
.portal-rich td,.portal-rich th{border:1px solid #dbe3f0;padding:6px 10px}
.portal-rich .katex{font-size:1.05em}
.portalnav button{font-weight:650}
@media(max-width:520px){.portal-item{padding:16px}.portal-item .portal-rich{font-size:14px}}

/* 8.4: 기존 학생 공지 목록 / 상세 화면 */
.portal-notice-listitem{display:block;width:100%;height:auto;text-align:left;background:#fff;color:#14213d;border:1px solid #dbe3f0;border-radius:14px;padding:17px 18px;margin:10px 0;line-height:1.6;white-space:normal}
.portal-notice-listitem:hover{background:#f7f9ff}.portal-notice-listtitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.portal-notice-listitem strong{font-size:16px}.portal-notice-listitem small{display:block;margin-top:6px;color:#8190a7;font-size:12px}

.portal-notice-detail h2{font-size:25px;letter-spacing:-.04em;margin:12px 0}.portal-important{display:inline-block;background:#ffe9ec;color:#dc3654;border-radius:20px;padding:4px 9px;font-size:12px;font-weight:650}
.portal-notice-date{font-size:12px;color:#8a98aa;margin:8px 0 18px}.portal-notice-body{background:#f8f8f7;border-radius:14px;padding:20px 22px;color:#111;line-height:1.95;font-size:15px}
.portal-notice-body .portal-rich{color:#111;font-size:15px;line-height:1.95}.portal-notice-body .portal-rich div{margin:0}.portal-notice-body .portal-rich br{display:block}

</style>

<script>
(()=>{const b=document.getElementById('sp24play'),v=document.getElementById('sp24vol'),status=document.getElementById('sp24status');let ctx,master,timer,playing=false,busy=false,step=0;const seq=[[60,64,67,72],[57,60,64,69],[53,57,60,65],[55,59,62,67]];const beat=60/124;let nextTime=0;try{v.value=localStorage.getItem('sp24volume')||'50'}catch(e){}function volume(){if(master)master.gain.setTargetAtTime(Number(v.value)/100*.65,ctx.currentTime,.03);try{localStorage.setItem('sp24volume',v.value)}catch(e){}}v.addEventListener('input',volume);function tone(n,t,d,a,type='triangle'){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=440*2**((n-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(a,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.01)}function drum(t,kick){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(kick?135:380,t);o.frequency.exponentialRampToValueAtTime(kick?45:180,t+.09);g.gain.setValueAtTime(kick?.23:.055,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(master);o.start(t);o.stop(t+.13)}function tick(){if(!playing||ctx.state!=='running')return;if(nextTime<ctx.currentTime)nextTime=ctx.currentTime+.02;while(nextTime<ctx.currentTime+.12){const j=step%8,c=seq[Math.floor(step/8)%4],t=nextTime;const pattern=[0,2,1,3,2,1,2,3];tone(c[pattern[j]]+12,t,beat*.38,.085,'triangle');if(j%2===0)tone(c[j===4?2:0]-24,t,beat*.7,.16,'triangle');if(j===0||j===4)drum(t,true);if(j===2||j===6)drum(t,false);if(j%2===1)tone(95,t,.035,.018,'square');if(j===1||j===5)c.slice(0,3).forEach(n=>tone(n,t,beat*.28,.035,'triangle'));step++;nextTime+=beat/2;}}let enabled=true,inside=false;try{enabled=localStorage.getItem('sp26enabled')!=='0'}catch(e){}function eligible(){try{return !!token && !document.getElementById('quizArea')?.classList.contains('hidden') && (!!activeAttempt || !!(liveRoom19 && !liveRoom19.closed && !liveRoom19.finished && !liveRoom19.blocked))}catch(e){return false}}function stop(){playing=false;clearInterval(timer);if(master){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setValueAtTime(0,ctx.currentTime)}b.setAttribute('aria-pressed','false');}async function unlock(){if(!enabled||busy)return;busy=true;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)throw Error('브라우저 미지원');if(!ctx){ctx=new A();master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination)}await ctx.resume();}catch(e){status.textContent='음악 준비 실패: '+e.message}finally{busy=false;sync()}}function sync(){const now=eligible();inside=now;const overlay=document.getElementById('quizLiveOverlay'),bar=document.getElementById('sp24');const host=document.getElementById('quizArea');if(now&&host&&bar.parentNode!==host)host.prepend(bar);bar.hidden=!now;if(now)bar.style.removeProperty('display');else bar.style.setProperty('display','none','important');if(!now||!enabled||document.hidden){if(playing)stop();}else if(!playing&&ctx&&ctx.state==='running'){volume();playing=true;step=0;nextTime=ctx.currentTime+.05;tick();timer=setInterval(tick,40);b.setAttribute('aria-pressed','true')}b.textContent=enabled?'♫ 음악 끄기':'♫ 음악 켜기';status.textContent=!enabled?'음악 꺼짐':!now?'퀴즈 입장 시 자동 재생':playing?'재생 중':'음악을 시작하려면 화면을 눌러 주세요';}b.onclick=()=>{enabled=!enabled;try{localStorage.setItem('sp26enabled',enabled?'1':'0')}catch(e){}if(enabled)void unlock();sync()};document.addEventListener('click',e=>{if(e.target!==b&&enabled&&(!ctx||ctx.state!=='running'))void unlock()},true);document.addEventListener('visibilitychange',sync);window.addEventListener('pagehide',stop);setInterval(sync,200);})();
</script>

// 7.3단계: KaTeX로 명시적 수식과 안전하게 인식되는 짧은 수식만 조판합니다.
// 한글 문장은 텍스트로 유지하고, 인식하지 못하는 부분은 원문 그대로 표시합니다.
const MATH_SUP={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'-'};
function normalizeMath(s){
  return s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]+/g,t=>'^{' + [...t].map(c=>MATH_SUP[c]).join('') + '}')
    .replace(/\\leq?\b|≤|<=/g,'\\leq ')
    .replace(/\\geq?\b|≥|>=/g,'\\geq ')
    .replace(/\\neq\b|≠|!=/g,'\\ne ')
    .replace(/∈/g,'\\in ').replace(/∉/g,'\\notin ')
    .replace(/∩/g,'\\cap ').replace(/∪/g,'\\cup ')
    .replace(/⊆/g,'\\subseteq ').replace(/⊂/g,'\\subset ')
    .replace(/⊇/g,'\\supseteq ').replace(/⊃/g,'\\supset ')
    .replace(/∅/g,'\\varnothing ').replace(/×/g,'\\times ')
    .replace(/÷/g,'\\div ')
    .replace(/\^([0-9a-zA-Z])/g,'^{$1}');
}
// 학생 화면 수식 표시: 교사용 미리보기와 동일한 근호·분수·변수 규칙.
// 데이터 원문은 변경하지 않으며, $...$ 및 \(...\) 구간은 우선 보존합니다.
function studentPlainMath21(text){
  const explicit=/^(?:\$[^$\n]+\$|\\\([^\n]+?\\\))$/;
  const parts=String(text).split(/(\$[^$\n]+\$|\\\([^\n]+?\\\))/g);
  const atom='(?:\\([^()]*\\)|√\\([^()]*\\)|√[A-Za-z0-9]+|[A-Za-z0-9]+)';
  const numerator='(?:\\([^()]*\\)\\s*√\\([^()]*\\)|'+atom+')';
  const fraction=new RegExp('('+numerator+')\\s*[/÷]\\s*('+atom+')','g');
  function latexAtom(v){return v.trim().replace(/−/g,'-').replace(/√\(([^()]*)\)/g,(_,x)=>'\\sqrt{'+x+'}').replace(/√([A-Za-z0-9]+)/g,(_,x)=>'\\sqrt{'+x+'}');}
  return parts.map(part=>{

// 기존 편집기에서 저장한 HTML을 허용된 서식만 살려 안전하게 렌더링합니다.
// 이벤트 핸들러, 스크립트, iframe, 외부 이미지 등은 삽입하지 않습니다.
function portalRich(target,source){
 const raw=String(source==null?'':source);
 // 저장소에서 HTML이 &lt;div&gt;처럼 이스케이프된 경우 한 단계만 복원합니다.
 // DOMParser로만 해석하고 아래 허용 목록을 통과한 요소만 실제 화면에 생성합니다.
 const parser=new DOMParser();
 const temp=parser.parseFromString('<div>'+raw+'</div>','text/html');
 const text=temp.body.firstElementChild?.textContent||'';
 const restored= /&lt;\/?(?:div|br|p|b|strong|font|span|i|em|u|ul|ol|li|a|h[1-6])\b/i.test(raw) ? text : raw;
 const doc=parser.parseFromString('<div>'+restored+'</div>','text/html');
 const allowed=new Set(['DIV','P','BR','B','STRONG','I','EM','U','S','STRIKE','SPAN','FONT','UL','OL','LI','BLOCKQUOTE','SUP','SUB','H1','H2','H3','H4','H5','H6','A','TABLE','THEAD','TBODY','TR','TH','TD','HR']);
 const skip=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','SVG','MATH','FORM','INPUT','BUTTON','TEXTAREA','SELECT','VIDEO','AUDIO','IMG','LINK','META']);
 const colors=new Set(['red','blue','green','black','gray','grey','navy','maroon','purple','teal','orange','brown','#de0d0d','#ff0000','#000000','#0000ff','#008000']);
 function safeColor(c){c=String(c||'').trim().toLowerCase();return colors.has(c)?c:'';}
 function convert(node){
  if(node.nodeType===3)return document.createTextNode(node.nodeValue);
  if(node.nodeType!==1)return document.createDocumentFragment();
  if(skip.has(node.tagName))return document.createDocumentFragment();
  const valid=allowed.has(node.tagName);const out=valid?document.createElement(node.tagName==='FONT'?'span':node.tagName.toLowerCase()):document.createDocumentFragment();
  if(valid){
   if(node.tagName==='FONT'){const c=safeColor(node.getAttribute('color'));if(c)out.style.color=c;}
   if(node.tagName==='SPAN'||node.tagName==='DIV'||node.tagName==='P'){
    const style=String(node.getAttribute('style')||'');
    const match=style.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);const c=match?safeColor(match[1]):'';if(c)out.style.color=c;
    if(/(?:^|;)\s*font-weight\s*:\s*(?:bold|[7-9]00)\b/i.test(style))out.style.fontWeight='bold';
    if(/(?:^|;)\s*text-decoration\s*:\s*underline\b/i.test(style))out.style.textDecoration='underline';
   }
   if(node.tagName==='A'){
    try{const url=new URL(node.getAttribute('href')||'',location.href);if(url.protocol==='https:'||url.protocol==='http:'){out.href=url.href;out.target='_blank';out.rel='noopener noreferrer';}}catch(e){}
   }
  }
  for(const child of node.childNodes)out.append(convert(child));return out;
 }
 const rich=portalNode('div',undefined,'portal-rich');
 for(const node of doc.body.firstElementChild.childNodes)rich.append(convert(node));
 target.append(rich);
}

 fields.forEach(([key,label])=>{const lab=portalNode('label',label);lab.htmlFor='portal_'+key;let field;if(key==='understanding'){field=document.createElement('select');field.append(new Option('이해도 선택',''),...[1,2,3,4,5].map(i=>new Option(i+'점',String(i))))}else if(['content','difficult','notUnderstood','easy','good','disappointing','question'].includes(key)){field=document.createElement('textarea');field.maxLength=key==='content'?5000:1500;}else{field=document.createElement('input');field.maxLength=key==='unit'?80:150;}field.id='portal_'+key;field.name=key;if(['unit','title','content','understanding'].includes(key))field.required=true;form.append(lab,field)});
 const b=portalNode('button',kind==='questions'?'익명 질문 등록':'익명 피드백 제출');b.type='submit';form.append(b);const info=portalNode('p','새 질문은 로그인한 학생 계정에 연결되어 다른 기기에서도 확인할 수 있습니다. 이전 질문은 작성 당시 브라우저의 익명 접근키가 있어야 표시될 수 있습니다.','muted');form.append(info);
 form.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{const data=Object.fromEntries(new FormData(form).entries());const r=await portalApi(kind==='questions'?'question':'feedback','POST',data);msg(r.message||'저장되었습니다.');await portalLoad(kind)}catch(err){msg(err.message,true)}finally{b.disabled=false}};box.append(form);
}

// LIVE 9.8: 각 문항 진행 정보는 독립적으로 전송합니다.
// 이전 요청이 느려도 다음 문항 전송을 막지 않습니다.
function syncLiveProgress94(a){
 const ticket=a.ticket,completed=a.index,total=a.questions.length;
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),9000);
 return fetch(API+'/api/live-progress',{
  method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
  body:JSON.stringify({ticket,currentQuestion:completed,totalQuestions:total}),
  signal:controller.signal
 }).then(async res=>{
  if(!res.ok){let detail='';try{detail=(await res.json()).error||'';}catch(e){}
   console.warn('LIVE 진행률 동기화 실패',res.status,detail);}
 }).catch(e=>console.warn('LIVE 진행률 동기화 지연',e.message)).finally(()=>clearTimeout(timeout));
}

// 모든 const 초기화 이후에 자동 로그인 및 메뉴를 시작합니다.
// 8.6: 첫 화면을 먼저 그린 후 초기 네트워크 요청을 시작합니다.
// 퀴즈/학습기록은 '퀴즈' 메뉴에 진입할 때만 불러옵니다.
function startup86(){
 if(token){$('login').classList.add('hidden');$('account').classList.remove('hidden');$('who').textContent='로그인 정보 확인 중';portalInit();records();}
 else {classes();}
}
requestAnimationFrame(()=>setTimeout(startup86,0));
</script>

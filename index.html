<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수포일러 · 학생용 연결 테스트</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f1e8;color:#25231f;font-family:system-ui,'Malgun Gothic',sans-serif}.card{max-width:560px;margin:7vh auto;background:#fffdf9;padding:30px 24px;border:1px solid #e5dccc;border-radius:22px;box-shadow:0 10px 30px #00000008}small{letter-spacing:.15em;color:#886c4d}h1{font-size:38px;margin:12px 0 0}.sub{color:#876c51;margin:4px 0 24px}.note{padding:15px;background:#f4efe5;border-radius:12px;line-height:1.7}.field{display:block;font-weight:700;margin-top:20px}input{width:100%;padding:14px;margin:9px 0 14px;border:1px solid #d9d0c3;border-radius:12px;font-size:15px}button{width:100%;background:#3a6356;color:white;border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:700;cursor:pointer}#result{margin-top:16px;white-space:pre-wrap;line-height:1.7}footer{font-size:12px;color:#776c5c;text-align:center;margin-top:20px}
</style></head><body><main class="card"><small>MATH CLASSROOM</small><h1>수포일러</h1><p class="sub">수학 포기하기엔 아직 일러</p><div class="note"><b>3단계 · 안전한 API 연결 테스트</b><br>Google Apps Script와 분리된 서버에 연결할 수 있는지 확인합니다. <b>학생 이름·PIN·개인정보는 입력하지 마세요.</b></div><label class="field" for="api">Cloudflare Worker 주소</label><input id="api" type="url" placeholder="https://프로젝트명.계정.workers.dev" autocomplete="off"><button id="test">서버 연결 확인</button><div id="result" role="status" aria-live="polite"></div><footer>이 페이지는 실제 학생 인증 및 퀴즈 기능을 제공하지 않습니다.</footer></main><script>
const input=document.getElementById('api'),out=document.getElementById('result');
input.value=localStorage.getItem('supoiler_worker_test_url')||'';
document.getElementById('test').addEventListener('click',async()=>{
 const base=input.value.trim().replace(/\/+$/,'');
 if(!/^https:\/\/[a-z0-9.-]+\.workers\.dev$/i.test(base)){out.textContent='⚠️ Cloudflare Worker의 HTTPS 주소를 입력해 주세요.';return;}
 localStorage.setItem('supoiler_worker_test_url',base);
 out.textContent='연결 확인 중…';
 try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);let res;
 try{res=await fetch(base+'/api/health',{signal:controller.signal,cache:'no-store'});}finally{clearTimeout(timer)}
 const data=await res.json();if(!res.ok||data.ok!==true||data.service!=='supoiler-student-api')throw Error('예상한 서버 응답이 아닙니다.');
 out.textContent='✅ 독립 API 서버 연결 성공!\n서버 시각: '+data.time+'\n\n실제 학생계정과 PIN은 아직 연결되지 않았습니다.';
 }catch(err){out.textContent='❌ 연결 실패: '+err.message+'\nWorker 배포 상태와 주소를 확인해 주세요.';}
});
</script></body></html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f2e8">
<title>수포일러 | 학생 접속 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f2e8;color:#34352f;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fffdf9;max-width:440px;width:100%;border:1px solid #e9e0d1;border-radius:24px;padding:32px 26px;box-shadow:0 14px 40px #584b3114}.eyebrow{color:#88765c;font-size:13px;font-weight:700;letter-spacing:.08em}.brand{font-size:36px;font-weight:900;margin:10px 0 3px}.sub{font-size:15px;color:#756f64;margin:0 0 24px}.notice{background:#f5f0e6;padding:15px;border-radius:14px;font-size:14px;line-height:1.65;margin-bottom:20px}label{display:block;font-weight:700;margin:15px 0 7px;font-size:14px}input,select{width:100%;padding:13px;border:1px solid #d7d0c3;border-radius:11px;background:white;font-size:16px;color:#333}button{width:100%;padding:15px;background:#3b6356;color:white;border:0;border-radius:12px;font-weight:800;font-size:16px;margin-top:24px;cursor:pointer}.result{display:none;background:#eaf5ee;color:#245740;border-radius:14px;padding:16px;margin-top:18px;line-height:1.7;font-weight:650}.foot{font-size:12px;color:#827c73;text-align:center;margin-top:22px;line-height:1.6}
</style>
</head>
<body><main class="card"><div class="eyebrow">MATH CLASSROOM</div><div class="brand">수포일러</div><p class="sub">수학 포기하기엔 아직 일러</p><div class="notice"><strong>학생 접속 테스트 페이지</strong><br>이 페이지는 Google 계정 로그인 없이 열리는지 확인하기 위한 화면입니다. <strong>실제 학생 이름이나 PIN을 입력하지 마세요.</strong> 기존 수포일러 및 Google Sheets와 연결되지 않습니다.</div><label for="group">테스트 학년반</label><select id="group"><option value="">선택해 주세요</option><option>1-1 (예시)</option><option>1-2 (예시)</option><option>1-3 (예시)</option></select><label for="name">테스트 이름</label><input id="name" placeholder="예: 테스트" autocomplete="off" maxlength="20"><button id="check" type="button">접속 테스트하기</button><div class="result" id="result" role="status"></div><div class="foot">실제 로그인·PIN 인증·퀴즈 기능은 제공하지 않습니다.<br>접속 성공 여부만 확인합니다.</div></main><script>document.getElementById('check').addEventListener('click',function(){const group=document.getElementById('group').value;const name=document.getElementById('name').value.trim();const result=document.getElementById('result');result.style.display='block';if(!group||!name){result.textContent='테스트 학년반과 테스트 이름을 입력해 주세요.';return;}result.textContent='✅ 일반 웹사이트 접속과 화면 조작에 성공했습니다! 선생님께 접속 성공 여부만 알려주세요. (실제 계정 로그인 테스트는 아직 아닙니다.)';});</script>
<section style="max-width:720px;margin:22px auto;padding:18px;background:#f3f0e9;border-radius:16px">
<h2 style="font-size:19px;margin:0 0 10px">2단계 · 서버 연결 테스트</h2>
<p style="font-size:14px;line-height:1.6">별도로 만든 Apps Script 테스트 서버와 통신하는지 확인합니다. 학생 정보·PIN·퀴즈 데이터는 전송하지 않습니다.</p>
<label for="bridgeUrl" style="display:block;margin:12px 0 6px">테스트 서버 주소 (/exec)</label>
<input id="bridgeUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" style="width:100%;padding:12px;border:1px solid #bbb;border-radius:10px;font-size:14px">
<button id="bridgeTestButton" type="button" onclick="testSupoilerBridge()" style="margin-top:12px;width:100%;padding:14px;border:0;border-radius:10px;background:#345f53;color:white;font-weight:bold">서버 연결 확인</button>
<div id="bridgeResult" role="status" aria-live="polite" style="margin-top:12px;white-space:pre-wrap;font-size:14px"></div>
</section>
<script>
function testSupoilerBridge(){
  const url=document.getElementById('bridgeUrl').value.trim();
  const out=document.getElementById('bridgeResult');
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)){
    out.textContent='Apps Script 웹앱의 /exec 주소를 입력해 주세요.';return;
  }
  out.textContent='서버 응답을 기다리는 중...';
  const callback='supoilerPing'+Math.random().toString(36).slice(2);
  let done=false;
  const script=document.createElement('script');
  const timer=setTimeout(()=>finish('연결 실패 또는 시간 초과 (15초)'),15000);
  function finish(msg){
    if(done)return;done=true;clearTimeout(timer);delete window[callback];script.remove();out.textContent=msg;
  }
  window[callback]=function(data){
    finish(data&&data.ok&&data.service==='supoiler-bridge-test'
      ?'✅ 서버 연결 성공! 응답 시각: '+data.serverTime
      :'서버에서 예상하지 못한 응답을 받았습니다.');
  };
  script.onerror=()=>finish('서버에 연결하지 못했습니다. 배포 권한과 URL을 확인해 주세요.');
  script.src=url+'?callback='+encodeURIComponent(callback);
  document.head.appendChild(script);
}
</script>
</body></html>

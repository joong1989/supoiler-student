<style>

.portal-notice-listitem:hover{background:#f7f9ff}.portal-notice-listtitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.portal-notice-listitem strong{font-size:16px}.portal-notice-listitem small{display:block;margin-top:6px;color:#8190a7;font-size:12px}

<body>
<main class="wrap"><section class="card">
<header class="brand"><div class="brand-mark" aria-hidden="true">∑</div><div><h1>수포일러</h1><p>수학 포기하기엔 아직 일러 · 학생용</p></div></header>
<div id="login"><label for="cls">학년반</label><select id="cls"><option value="">불러오는 중...</option></select><label for="name">이름</label><input id="name" maxlength="30" autocomplete="name" placeholder="이름"><label for="pin">4자리 PIN</label><input id="pin" maxlength="4" inputmode="numeric" type="password" autocomplete="off" placeholder="숫자 4자리"><p class="muted">처음 이용하는 학생은 입력한 정보로 계정이 자동 생성될 수 있습니다. 이름과 PIN을 다른 사람에게 알려주지 마세요.</p><button id="loginBtn">로그인 / 처음 가입</button></div>
<div id="account" class="hidden"><h2 id="who"></h2><button id="logout">로그아웃</button><nav class="portalnav" id="portalNav" aria-label="학생 메뉴"></nav><section id="portalPanel" class="hidden"></section><div id="quizArea"><h3>공개 퀴즈</h3><div id="quizList">불러오는 중...</div><div id="quizDetail" class="hidden"></div><div id="quizPlay" class="hidden"></div><h3>내 학습기록</h3><div id="records">불러오는 중...</div></div></div>
<p id="msg" role="status" aria-live="polite"></p></section></main>
<script>
// 7.3단계: KaTeX로 명시적 수식과 안전하게 인식되는 짧은 수식만 조판합니다.
// 한글 문장은 텍스트로 유지하고, 인식하지 못하는 부분은 원문 그대로 표시합니다.
const MATH_SUP={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'-'};
function normalizeMath(s){
  return s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]+/g,t=>'^{' + [...t].map(c=>MATH_SUP[c]).join('') + '}')
    .replace(/\\leq?\b|≤|<=/g,'\\leq ')
    .replace(/\\geq?\b|≥|>=/g,'\\geq ')
    .replace(/\\neq\b|≠|!=/g,'\\ne ')
    .replace(/∈/g,'\\in ').replace(/∉/g,'\\notin ')
    .replace(/∩/g,'\\cap ').replace(/∪/g,'\\cup ')
    .replace(/⊆/g,'\\subseteq ').replace(/⊂/g,'\\subset ')
    .replace(/⊇/g,'\\supseteq ').replace(/⊃/g,'\\supset ')
    .replace(/∅/g,'\\varnothing ').replace(/×/g,'\\times ')
    .replace(/÷/g,'\\div ')
    .replace(/\^([0-9a-zA-Z])/g,'^{$1}');
}
function mathText(element,raw){
  const source=String(raw??'');element.replaceChildren();element.classList.add('math-content');
  const appendPlain=t=>{if(t)element.append(document.createTextNode(t));};
  const appendMath=t=>{
    if(!t)return;
    if(!window.katex){appendPlain(t);return;}
    try{
      const span=document.createElement('span');
      window.katex.render(normalizeMath(t),span,{throwOnError:true,strict:'ignore',trust:false,output:'htmlAndMathml'});
      element.append(span);
    }catch(e){appendPlain(t);}
  };
  // $...$와 \\(...\\)는 작성자가 명시한 수식으로 취급합니다.
  // 일반 문장에서는 변수+지수, 부등식, 집합 연산, 절댓값 등 확실한 패턴만 인식합니다.
  const explicit=/\$([^$\n]{1,300})\$|\\\(([^\n]{1,300}?)\\\)/g;
  function scanPlain(text){
    // 정규식은 한글 조사(는, 에, 이다 등)를 수식으로 끌어들이지 않도록 제한합니다.
    const expr=/(?:\|[A-Za-z][A-Za-z0-9^{}+\-* ]{0,18}\|\s*(?:<=|>=|[<>≤≥=])\s*-?\d+)|(?:[A-Za-z](?:\^\{?-?[A-Za-z0-9]+\}?|[⁰¹²³⁴⁵⁶⁷⁸⁹]+)?\s*(?:<=|>=|[<>≤≥=≠]|\\(?:leq|geq|neq)\b)\s*-?\d+(?:\^\{?\d+\}?)?)|(?:[A-Za-z]\s*(?:∈|∉|\\(?:in|notin)\b)\s*[A-Za-z])|(?:[A-Za-z]\s*(?:∪|∩|⊂|⊆|⊃|⊇|\\(?:cup|cap|subseteq|subset|supseteq|supset)\b)\s*[A-Za-z])|(?:[A-Za-z]\^\{?-?[A-Za-z0-9]+\}?)|(?:[A-Za-z][⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g;
    let last=0,m;
    while((m=expr.exec(text))){
      // 영단어 중간에서 변수를 잡지 않도록 좌측 경계 확인.
      if(m.index>0 && /[A-Za-z0-9_]/.test(text[m.index-1]))continue;
      appendPlain(text.slice(last,m.index));appendMath(m[0]);last=expr.lastIndex;
    }
    appendPlain(text.slice(last));
  }
  let last=0,m;
  while((m=explicit.exec(source))){scanPlain(source.slice(last,m.index));appendMath(m[1]??m[2]);last=explicit.lastIndex;}
  scanPlain(source.slice(last));
}

let activeAttempt=null,questionTimer=null;
const API='https://supoiler-student-api.joong1989.workers.dev';const $=id=>document.getElementById(id);let token=sessionStorage.getItem('supoiler_session5')||'';
function msg(s,err=false){$('msg').textContent=s;$('msg').className=err?'err':'ok'}
function showLogin(){token='';sessionStorage.removeItem('supoiler_session5');$('account').classList.add('hidden');$('login').classList.remove('hidden');$('pin').value='';}
async function classes(){try{const r=await(await fetch(API+'/api/classes')).json();if(!r.ok)throw Error();$('cls').replaceChildren(new Option('학년반 선택',''),...r.classes.map(x=>new Option(x,x)));}catch{$('cls').replaceChildren(new Option('학년반을 불러오지 못했습니다',''));msg('서버 연결을 확인해 주세요.',true)}}
function makeChart(box,quizzes,title,kind){
 const chart=document.createElement('section');chart.className='chart';const h=document.createElement('h4');h.textContent=title;chart.append(h);
 const ordered=[...quizzes].reverse().slice(-10);const max=kind==='score'?Math.max(1000,...ordered.map(q=>Number(q.score)||0)):100;
 ordered.forEach((q,i)=>{const value=kind==='score'?(Number(q.score)||0):(q.total?Math.round(q.correct/q.total*100):0);const row=document.createElement('div');row.className='chartrow';const name=document.createElement('span');name.textContent=(i+1)+'회차';name.title=q.title+' · '+q.date;const track=document.createElement('div');track.className='charttrack';const fill=document.createElement('div');fill.className='chartfill'+(kind==='rate'?' rate':'');fill.style.width=Math.max(0,Math.min(100,value/max*100))+'%';track.append(fill);const val=document.createElement('span');val.textContent=value+(kind==='rate'?'%':'점');row.append(name,track,val);chart.append(row)});box.append(chart);
}
async function showReview(resultId,container){
 container.replaceChildren();const loading=document.createElement('p');loading.textContent='오답 정보를 불러오는 중...';container.append(loading);
 try{const res=await fetch(API+'/api/my-record/'+encodeURIComponent(resultId),{headers:{Authorization:'Bearer '+token}});const r=await res.json();if(!r.ok)throw Error(r.error||'조회 실패');container.replaceChildren();
 const title=document.createElement('h4');title.textContent=r.result.title+' · '+r.result.correct+'/'+r.result.total+'문항 정답';container.append(title);
 if(!r.items.length){const p=document.createElement('p');p.textContent='이전 응시의 문항별 답안 정보가 없습니다.';container.append(p)}
 r.items.forEach(item=>{const card=document.createElement('div');card.className='review '+(item.correct?'good':'bad');const h=document.createElement('strong');h.textContent=item.number+'번 · '+(item.correct?'정답':'오답')+(item.timedOut?' (시간 초과)':'');const q=document.createElement('p');mathText(q,item.question);const a=document.createElement('p');mathText(a,'내 답: '+item.myAnswer);card.append(h,q,a);if(!item.correct){const c=document.createElement('p');mathText(c,'정답: '+item.correctAnswer);card.append(c)}container.append(card)});
 }catch(e){container.textContent='오답 확인 실패: '+e.message}
}
async function records(){try{const res=await fetch(API+'/api/my-record',{headers:{Authorization:'Bearer '+token}}),r=await res.json();if(!r.ok){if(res.status===401)showLogin();throw Error(r.error||'기록 조회 실패')};$('who').textContent=r.student.className+' '+r.student.name;const box=$('records');box.replaceChildren();const s=document.createElement('div');s.className='stat';s.textContent=`참여 ${r.summary.count}회 · 평균 ${r.summary.avgScore}점 · 정답률 ${r.summary.correctRate}%`;box.append(s);
 if(r.quizzes.length){makeChart(box,r.quizzes,'점수 변화 (최근 10회)','score');makeChart(box,r.quizzes,'정답률 변화 (최근 10회)','rate')}
 for(const q of r.quizzes){const d=document.createElement('div');d.className='quiz';const text=document.createElement('div');text.textContent=`${q.date} · ${q.title} · ${q.score}점 (${q.correct}/${q.total} 정답, 오답 ${q.wrong}개)`;const b=document.createElement('button');b.className='smallbtn';b.textContent='문항별 결과 확인';const detail=document.createElement('div');detail.className='detailbox hidden';b.onclick=async()=>{if(!detail.classList.contains('hidden')){detail.classList.add('hidden');b.textContent='문항별 결과 확인';return;}detail.classList.remove('hidden');b.textContent='결과 접기';await showReview(q.resultId,detail)};d.append(text,b,detail);box.append(d)}if(!r.quizzes.length){const p=document.createElement('p');p.textContent='아직 참여한 퀴즈가 없습니다.';box.append(p)}}catch(e){msg(e.message,true)}}
$('loginBtn').onclick=async()=>{const className=$('cls').value,name=$('name').value.trim(),pin=$('pin').value;if(!className||!name||!/^[0-9]{4}$/.test(pin))return msg('학년반, 이름, 숫자 4자리 PIN을 입력해 주세요.',true);$('loginBtn').disabled=true;msg('확인 중...');try{const res=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({className,name,pin})}),r=await res.json();if(!r.ok)throw Error(r.error||'로그인 실패');token=r.session;sessionStorage.setItem('supoiler_session5',token);$('login').classList.add('hidden');$('account').classList.remove('hidden');msg(r.created?'계정이 생성되었습니다.':'로그인되었습니다.');window._quiz86Loaded=false;portalInit();records()}catch(e){msg(e.message,true)}finally{$('loginBtn').disabled=false}};
$('logout').onclick=()=>{if(activeAttempt){msg('진행 중인 퀴즈를 마친 뒤 로그아웃해 주세요.',true);return;}showLogin();window._quiz86Loaded=false;classes();msg('로그아웃되었습니다.')};// 초기 실행은 포털 상수 및 함수 선언이 완료된 후 수행합니다.

async function loadQuizzes(){
 const box=$('quizList');box.textContent='공개 퀴즈를 불러오는 중...';
 try{const res=await fetch(API+'/api/quizzes',{headers:{Authorization:'Bearer '+token}});const r=await res.json();if(!r.ok)throw Error(r.error||'퀴즈 조회 실패');box.replaceChildren();
 if(!r.quizzes.length){box.textContent='현재 공개된 퀴즈가 없습니다.';return;}

function liveSaveKey(quizId){return 'supoiler_live_resume_v1_'+String(quizId)+'_'+String(token||'').slice(-28);}
function liveReadSaved(quizId){try{const data=JSON.parse(localStorage.getItem(liveSaveKey(quizId))||'null');if(!data||data.quizId!==quizId||!data.ticket||!Array.isArray(data.answers)||!Number.isInteger(data.index)||data.index<0)return null;return data;}catch(e){return null;}}
function liveSaveAttempt(a){try{if(!a||!a.quiz||!a.ticket)return;localStorage.setItem(liveSaveKey(a.quiz.quizId||a.quiz.id),JSON.stringify({quizId:a.quiz.quizId||a.quiz.id,ticket:a.ticket,index:a.index,answers:a.answers,updatedAt:Date.now()}));}catch(e){console.warn('이어풀기 저장 실패',e);}}
function liveClearSaved(a){try{if(a&&a.quiz)localStorage.removeItem(liveSaveKey(a.quiz.quizId||a.quiz.id));}catch(e){}}
async function startQuiz(quizId){
 if(activeAttempt)return msg('진행 중인 퀴즈를 먼저 마쳐 주세요.',true);
 const box=$('quizPlay');box.classList.remove('hidden');box.textContent='퀴즈를 준비하는 중...';$('quizDetail').classList.add('hidden');
 try{const res=await fetch(API+'/api/quiz-start',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({quizId})});const r=await res.json();if(!r.ok)throw Error(r.error||'퀴즈 시작 실패');if(!r.questions.length)throw Error('문항이 없습니다.');
 const saved=liveReadSaved(quizId);
 let restored=false;
 if(saved&&saved.index<=r.questions.length&&saved.answers.length===saved.index&&saved.answers.every((answer,i)=>String(answer.questionId)===String(r.questions[i].questionId))){
   // 저장된 ticket으로 동일한 응시를 이어갑니다. 새로운 ticket으로 덮어쓰지 않습니다.
   activeAttempt={ticket:saved.ticket,quiz:{...r.quiz,quizId},questions:r.questions,index:saved.index,answers:saved.answers};restored=true;
 }else{activeAttempt={ticket:r.ticket,quiz:{...r.quiz,quizId},questions:r.questions,index:0,answers:[]};liveSaveAttempt(activeAttempt);}
 if(activeAttempt.index>=activeAttempt.questions.length){await submitAttempt();return;}
 renderQuestion();void syncLiveProgress94(activeAttempt);
 if(restored)msg((activeAttempt.index+1)+'번 문제부터 이어서 풉니다.');box.scrollIntoView({behavior:'smooth',block:'start'});
 }catch(e){box.textContent='퀴즈를 시작하지 못했습니다. 다시 접속을 시도해 주세요.';msg(e.message,true)}

function renderQuestion(){
 clearInterval(questionTimer);const a=activeAttempt;if(!a)return;const q=a.questions[a.index],box=$('quizPlay');box.replaceChildren();

 const timer=document.createElement('p');timer.className='stat';box.append(timer);
 const form=document.createElement('div');let answerInput;
 if(q.type==='객관식'){
  const group='choice'+a.index;q.options.forEach((opt,i)=>{const label=document.createElement('label');label.className='option';const radio=document.createElement('input');radio.type='radio';radio.name=group;radio.value=String(i+1);radio.style.width='auto';radio.style.marginRight='10px';label.append(radio);const optionText=document.createElement('span');mathText(optionText,(i+1)+'. '+opt);label.append(optionText);form.append(label)});
  answerInput=()=>form.querySelector('input:checked')?.value||'';
 }else{const inp=document.createElement('input');inp.placeholder='답 입력';inp.maxLength=300;form.append(inp);answerInput=()=>inp.value.trim();}
 box.append(form);const btn=document.createElement('button');btn.textContent=a.index===a.questions.length-1?'마지막 답안 제출':'다음 문항';box.append(btn);
 const start=performance.now(),limit=Math.max(0,Number(q.timeLimit)||0);let done=false;
 const complete=async(timeout=false)=>{if(done)return;done=true;clearInterval(questionTimer);btn.disabled=true;const elapsed=(performance.now()-start)/1000;
 const responseTimeSec=Math.round((limit>0?Math.min(elapsed,limit):elapsed)*1000)/1000;
 a.answers.push({questionId:q.questionId,answer:timeout?'':answerInput(),responseTimeSec,timedOut:timeout});a.index++;liveSaveAttempt(a);
 // 9.4: 답안 내용은 전송하지 않고 완료 문항 수만 교사용 LIVE에 동기화합니다.
 const progressSave=syncLiveProgress94(a);
 if(a.index<a.questions.length)renderQuestion();else {
   await progressSave; // 마지막 진행률 저장 후 최종 제출
   await submitAttempt();
 }};
 btn.onclick=()=>complete(false);
 const tick=()=>{const elapsed=(performance.now()-start)/1000;if(limit>0){const remain=Math.max(0,limit-elapsed);timer.textContent='남은 시간: '+remain.toFixed(1)+'초';if(remain<=0)complete(true);}else timer.textContent='제한시간 없음';};
 tick();questionTimer=setInterval(tick,100);

// 8단계: 기존 시트 기반 학생 포털. 질문/피드백은 기존 브라우저의 익명 접근키를 재사용할 수 있습니다.

function portalOwnerToken(){
 const keys=['suporiler_anonymous_owner_v82','supoiler_anonymous_owner_v82','supoiler_owner_token_v82','anonymousOwnerTokenV82'];
 for(const k of keys){const x=localStorage.getItem(k);if(x&&/^[a-zA-Z0-9_-]{20,120}$/.test(x))return x;}
 let x=localStorage.getItem('supoiler_portal_owner_v8');if(!x){x='anon_'+Array.from(crypto.getRandomValues(new Uint8Array(24)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('supoiler_portal_owner_v8',x);}return x;
}
function portalNode(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e;}
// 기존 편집기에서 저장한 HTML을 허용된 서식만 살려 안전하게 렌더링합니다.
// 이벤트 핸들러, 스크립트, iframe, 외부 이미지 등은 삽입하지 않습니다.
function portalRich(target,source){
 const raw=String(source==null?'':source);
 // 저장소에서 HTML이 &lt;div&gt;처럼 이스케이프된 경우 한 단계만 복원합니다.
 // DOMParser로만 해석하고 아래 허용 목록을 통과한 요소만 실제 화면에 생성합니다.
 const parser=new DOMParser();
 const temp=parser.parseFromString('<div>'+raw+'</div>','text/html');
 const text=temp.body.firstElementChild?.textContent||'';
 const restored= /&lt;\/?(?:div|br|p|b|strong|font|span|i|em|u|ul|ol|li|a|h[1-6])\b/i.test(raw) ? text : raw;
 const doc=parser.parseFromString('<div>'+restored+'</div>','text/html');
 const allowed=new Set(['DIV','P','BR','B','STRONG','I','EM','U','S','STRIKE','SPAN','FONT','UL','OL','LI','BLOCKQUOTE','SUP','SUB','H1','H2','H3','H4','H5','H6','A','TABLE','THEAD','TBODY','TR','TH','TD','HR']);
 const skip=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','SVG','MATH','FORM','INPUT','BUTTON','TEXTAREA','SELECT','VIDEO','AUDIO','IMG','LINK','META']);
 const colors=new Set(['red','blue','green','black','gray','grey','navy','maroon','purple','teal','orange','brown','#de0d0d','#ff0000','#000000','#0000ff','#008000']);
 function safeColor(c){c=String(c||'').trim().toLowerCase();return colors.has(c)?c:'';}
 function convert(node){
  if(node.nodeType===3)return document.createTextNode(node.nodeValue);
  if(node.nodeType!==1)return document.createDocumentFragment();
  if(skip.has(node.tagName))return document.createDocumentFragment();
  const valid=allowed.has(node.tagName);const out=valid?document.createElement(node.tagName==='FONT'?'span':node.tagName.toLowerCase()):document.createDocumentFragment();
  if(valid){
   if(node.tagName==='FONT'){const c=safeColor(node.getAttribute('color'));if(c)out.style.color=c;}
   if(node.tagName==='SPAN'||node.tagName==='DIV'||node.tagName==='P'){
    const style=String(node.getAttribute('style')||'');
    const match=style.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);const c=match?safeColor(match[1]):'';if(c)out.style.color=c;
    if(/(?:^|;)\s*font-weight\s*:\s*(?:bold|[7-9]00)\b/i.test(style))out.style.fontWeight='bold';
    if(/(?:^|;)\s*text-decoration\s*:\s*underline\b/i.test(style))out.style.textDecoration='underline';
   }
   if(node.tagName==='A'){
    try{const url=new URL(node.getAttribute('href')||'',location.href);if(url.protocol==='https:'||url.protocol==='http:'){out.href=url.href;out.target='_blank';out.rel='noopener noreferrer';}}catch(e){}
   }
  }
  for(const child of node.childNodes)out.append(convert(child));return out;
 }
 const rich=portalNode('div',undefined,'portal-rich');
 for(const node of doc.body.firstElementChild.childNodes)rich.append(convert(node));
 target.append(rich);
}

 return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}${m[4]?' '+m[4].padStart(2,'0')+':'+m[5]:''}`:t;
}

   if(kind==='notices')box.append(portalItem(x.title,x.createdAt||x.date,(x.importance==='중요'?'[중요] ':'')+x.content));
   if(kind==='lessons')box.append(portalItem(x.unit||'수업 기록',[x.date,x.className].filter(Boolean).join(' · '),x.content));
   if(kind==='materials'){const item=portalItem(x.title||'수업자료',[x.unit,x.type,x.folderName].filter(Boolean).join(' · '));if(/^https:\/\//i.test(x.link)){const a=portalNode('a','자료 열기','portal-link');a.href=x.link;a.target='_blank';a.rel='noopener noreferrer';item.append(a)}box.append(item);}
   if(kind==='questions')box.append(portalItem(x.title,[x.date,x.unit,x.status].filter(Boolean).join(' · '),'질문: '+x.content+(x.answer?'\n\n선생님 답변: '+x.answer:'')));
   if(kind==='feedbacks')box.append(portalItem(x.unit,[x.date,'이해도 '+x.understanding+'/5'].filter(Boolean).join(' · '),x.content));
  });
 }catch(e){box.replaceChildren(portalNode('p','불러오지 못했습니다: '+e.message,'err'));}
}
function portalForm(box,kind){const form=portalNode('form',undefined,'portal-form');const fields=kind==='questions'?[['unit','단원'],['title','질문 제목'],['content','질문 내용']]:[['unit','단원'],['content','오늘 수업 내용'],['understanding','이해도 (1~5)'],['difficult','어려웠던 점'],['notUnderstood','이해하지 못한 점'],['easy','쉬웠던 점'],['good','좋았던 점'],['disappointing','아쉬웠던 점'],['question','선생님께 질문']];
 fields.forEach(([key,label])=>{const lab=portalNode('label',label);lab.htmlFor='portal_'+key;let field;if(key==='understanding'){field=document.createElement('select');field.append(new Option('이해도 선택',''),...[1,2,3,4,5].map(i=>new Option(i+'점',String(i))))}else if(['content','difficult','notUnderstood','easy','good','disappointing','question'].includes(key)){field=document.createElement('textarea');field.maxLength=key==='content'?5000:1500;}else{field=document.createElement('input');field.maxLength=key==='unit'?80:150;}field.id='portal_'+key;field.name=key;if(['unit','title','content','understanding'].includes(key))field.required=true;form.append(lab,field)});
 const b=portalNode('button',kind==='questions'?'익명 질문 등록':'익명 피드백 제출');b.type='submit';form.append(b);const info=portalNode('p','기존 익명 접근키가 현재 브라우저에 남아 있다면 과거 내역도 확인할 수 있습니다. 다른 브라우저의 과거 내역은 자동으로 연결되지 않습니다.','muted');form.append(info);
 form.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{const data=Object.fromEntries(new FormData(form).entries());const r=await portalApi(kind==='questions'?'question':'feedback','POST',data);msg(r.message||'저장되었습니다.');await portalLoad(kind)}catch(err){msg(err.message,true)}finally{b.disabled=false}};box.append(form);
}

// LIVE 9.8: 각 문항 진행 정보는 독립적으로 전송합니다.
// 이전 요청이 느려도 다음 문항 전송을 막지 않습니다.
function syncLiveProgress94(a){
 const ticket=a.ticket,completed=a.index,total=a.questions.length;
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),9000);
 return fetch(API+'/api/live-progress',{
  method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
  body:JSON.stringify({ticket,currentQuestion:completed,totalQuestions:total}),
  signal:controller.signal
 }).then(async res=>{
  if(!res.ok){let detail='';try{detail=(await res.json()).error||'';}catch(e){}
   console.warn('LIVE 진행률 동기화 실패',res.status,detail);}
 }).catch(e=>console.warn('LIVE 진행률 동기화 지연',e.message)).finally(()=>clearTimeout(timeout));
}

// 모든 const 초기화 이후에 자동 로그인 및 메뉴를 시작합니다.
// 8.6: 첫 화면을 먼저 그린 후 초기 네트워크 요청을 시작합니다.
// 퀴즈/학습기록은 '퀴즈' 메뉴에 진입할 때만 불러옵니다.
function startup86(){
 if(token){$('login').classList.add('hidden');$('account').classList.remove('hidden');$('who').textContent='로그인 정보 확인 중';portalInit();records();}
 else {classes();}
}
requestAnimationFrame(()=>setTimeout(startup86,0));
</script>

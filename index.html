<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수포일러 | 학생</title><style>body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f5f7fb;color:#17233d;margin:0}.wrap{max-width:560px;margin:7vh auto;padding:18px}.card{background:white;border-radius:18px;padding:26px;box-shadow:0 8px 28px #182b4b14}h1{margin:0 0 8px}p{color:#566176}label{display:block;margin-top:17px;font-weight:600}input,select{box-sizing:border-box;width:100%;font:inherit;padding:13px;border:1px solid #cbd5e1;border-radius:10px;margin-top:6px}button{border:0;border-radius:10px;background:#2546c7;color:white;padding:13px 17px;font:inherit;cursor:pointer;margin-top:20px;width:100%}button:disabled{opacity:.5}.muted{font-size:13px}.err{color:#b42318}.ok{color:#167145}.hidden{display:none}.stat{background:#eef2ff;padding:12px;border-radius:10px;margin:10px 0}.quiz{padding:14px 0;border-bottom:1px solid #e2e8f0}.quizcard{border:1px solid #dbe2ed;border-radius:12px;padding:14px;margin:12px 0}.quizcard button{margin-top:8px}.question{padding:12px 0;border-bottom:1px solid #e2e8f0}.option{display:block;padding:7px 0}.info{font-size:13px;color:#667085}</style></head><body><main class="wrap"><section class="card"><h1>수포일러</h1><p>수학 포기하기엔 아직 일러 · 학생용</p><div id="login"><label>학년반<select id="cls"><option value="">불러오는 중...</option></select></label><label>이름<input id="name" maxlength="30" autocomplete="name" placeholder="이름"></label><label>4자리 PIN<input id="pin" maxlength="4" inputmode="numeric" type="password" autocomplete="off" placeholder="숫자 4자리"></label><p class="muted">처음 이용하는 학생은 입력한 정보로 계정이 자동 생성될 수 있습니다. 이름과 PIN을 다른 사람에게 알려주지 마세요.</p><button id="loginBtn">로그인 / 처음 가입</button></div><div id="account" class="hidden"><h2 id="who"></h2><button id="logout">로그아웃</button><h3>공개 퀴즈</h3><div id="quizList">불러오는 중...</div><div id="quizDetail" class="hidden"></div><h3>내 학습기록</h3><div id="records">불러오는 중...</div></div><p id="msg" role="status"></p></section></main><script>
const API='https://supoiler-student-api.joong1989.workers.dev';const $=id=>document.getElementById(id);let token=sessionStorage.getItem('supoiler_session5')||'';
function msg(s,err=false){$('msg').textContent=s;$('msg').className=err?'err':'ok'}
function showLogin(){token='';sessionStorage.removeItem('supoiler_session5');$('account').classList.add('hidden');$('login').classList.remove('hidden');$('pin').value='';}
async function classes(){try{const r=await(await fetch(API+'/api/classes')).json();if(!r.ok)throw Error();$('cls').replaceChildren(new Option('학년반 선택',''),...r.classes.map(x=>new Option(x,x)));}catch{$('cls').replaceChildren(new Option('학년반을 불러오지 못했습니다',''));msg('서버 연결을 확인해 주세요.',true)}}
async function records(){try{const res=await fetch(API+'/api/my-record',{headers:{Authorization:'Bearer '+token}}),r=await res.json();if(!r.ok){if(res.status===401)showLogin();throw Error(r.error||'기록 조회 실패')};$('who').textContent=r.student.className+' '+r.student.name;const box=$('records');box.replaceChildren();const s=document.createElement('div');s.className='stat';s.textContent=`참여 ${r.summary.count}회 · 평균 ${r.summary.avgScore}점 · 정답률 ${r.summary.correctRate}%`;box.append(s);for(const q of r.quizzes){const d=document.createElement('div');d.className='quiz';d.textContent=`${q.date} · ${q.title} · ${q.score}점 (${q.correct}/${q.total} 정답, 오답 ${q.wrong}개)`;box.append(d)}if(!r.quizzes.length){const p=document.createElement('p');p.textContent='아직 참여한 퀴즈가 없습니다.';box.append(p)}}catch(e){msg(e.message,true)}}
$('loginBtn').onclick=async()=>{const className=$('cls').value,name=$('name').value.trim(),pin=$('pin').value;if(!className||!name||!/^[0-9]{4}$/.test(pin))return msg('학년반, 이름, 숫자 4자리 PIN을 입력해 주세요.',true);$('loginBtn').disabled=true;msg('확인 중...');try{const res=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({className,name,pin})}),r=await res.json();if(!r.ok)throw Error(r.error||'로그인 실패');token=r.session;sessionStorage.setItem('supoiler_session5',token);$('login').classList.add('hidden');$('account').classList.remove('hidden');msg(r.created?'계정이 생성되었습니다.':'로그인되었습니다.');await Promise.all([records(),loadQuizzes()])}catch(e){msg(e.message,true)}finally{$('loginBtn').disabled=false}};
$('logout').onclick=()=>{showLogin();msg('로그아웃되었습니다.')};classes();if(token){$('login').classList.add('hidden');$('account').classList.remove('hidden');Promise.all([records(),loadQuizzes()])}

async function loadQuizzes(){
 const box=$('quizList');box.textContent='공개 퀴즈를 불러오는 중...';
 try{const res=await fetch(API+'/api/quizzes',{headers:{Authorization:'Bearer '+token}});const r=await res.json();if(!r.ok)throw Error(r.error||'퀴즈 조회 실패');box.replaceChildren();
 if(!r.quizzes.length){box.textContent='현재 공개된 퀴즈가 없습니다.';return;}
 for(const q of r.quizzes){const d=document.createElement('div');d.className='quizcard';const h=document.createElement('strong');h.textContent=q.title;const p=document.createElement('p');p.className='info';p.textContent=[q.unit,q.questionCount+'문항',q.startMode,q.gameMode].filter(Boolean).join(' · ');const b=document.createElement('button');b.textContent='문항 미리 보기';b.onclick=()=>previewQuiz(q.quizId);d.append(h,p,b);box.append(d);}
 }catch(e){box.textContent='퀴즈 목록을 불러오지 못했습니다.';msg(e.message,true)}
}
async function previewQuiz(quizId){
 const box=$('quizDetail');box.classList.remove('hidden');box.textContent='문항을 불러오는 중...';
 try{const res=await fetch(API+'/api/quizzes/'+encodeURIComponent(quizId),{headers:{Authorization:'Bearer '+token}});const r=await res.json();if(!r.ok)throw Error(r.error||'문항 조회 실패');box.replaceChildren();const h=document.createElement('h3');h.textContent=r.quiz.title;box.append(h);const p=document.createElement('p');p.className='info';p.textContent='6A단계: 문항 확인만 가능합니다. 답안 제출과 점수 저장은 다음 단계에서 연결합니다.';box.append(p);
 for(const q of r.questions){const d=document.createElement('div');d.className='question';const t=document.createElement('strong');t.textContent=q.number+'. '+q.question;d.append(t);if(q.type==='객관식'){q.options.forEach((x,i)=>{const o=document.createElement('div');o.className='option';o.textContent=(i+1)+'. '+x;d.append(o)});}else{const o=document.createElement('p');o.className='info';o.textContent='단답형 · 정답은 표시하지 않습니다.';d.append(o)}const tm=document.createElement('p');tm.className='info';tm.textContent=q.timeLimit?'제한시간 '+q.timeLimit+'초':'제한시간 없음';d.append(tm);box.append(d)}
 }catch(e){box.textContent='문항을 불러오지 못했습니다.';msg(e.message,true)}
}
</script></body></html>
